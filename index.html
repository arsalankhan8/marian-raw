<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mariani Metal | Architectural Metal &amp; Glass Fabrication</title>
  </head>
  <body>
    <form
      name="career-application"
      method="POST"
      enctype="multipart/form-data"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="career-application" />
      <input name="bot-field" />
      <input name="firstName" />
      <input name="lastName" />
      <input type="email" name="email" />
      <input name="phone" />
      <input name="areaOfInterest" />
      <input name="preferredLocation" />
      <input type="file" name="resume" />
      <textarea name="message"></textarea>
      <input name="positionAppliedFor" />
      <input name="positionLocation" />
      <input name="positionDepartment" />
      <input name="applicationRegion" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
